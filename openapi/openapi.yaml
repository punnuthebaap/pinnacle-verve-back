      additionalProperties: false
      properties:
        fullName: { type: string, minLength: 2, maxLength: 120 }
        phone: { type: string, pattern: "^[6-9][0-9]{9}$", description: Indian mobile number without +91. }
        line1: { type: string, minLength: 3, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, minLength: 2, maxLength: 80 }
        state: { type: string, minLength: 2, maxLength: 80 }
        pincode: { type: string, pattern: "^[1-9][0-9]{5}$" }

    PaymentMethod:
      type: string
      enum: [upi, card, netbanking, emi]

    CreateOrderRequest:
      type: object
      required: [email, shippingAddress, paymentMethod]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/Email" }
        shippingAddress: { $ref: "#/components/schemas/Address" }
        gstin:
          type: string
          pattern: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$"
        notes: { type: string, maxLength: 1000 }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }

    OrderItem:
      type: object
      required: [productSlug, productName, variantLabel, sku, image, unitPricePaise, quantity, lineTotalPaise]
      properties:
        productSlug: { type: string }
        productName: { type: string }
        variantLabel: { type: string }
        sku: { type: string }
        image: { $ref: "#/components/schemas/Image" }
        unitPricePaise: { $ref: "#/components/schemas/Paise" }
        quantity: { type: integer }
        lineTotalPaise: { $ref: "#/components/schemas/Paise" }

    Order:
      type: object
      required: [ref, status, paymentStatus, fulfilmentStatus, createdAt, email, shippingAddress, items, addons, totals, paymentMethod]
      properties:
        ref: { type: string }
        status: { type: string, enum: [pending_payment, placed, cancelled] }
        paymentStatus:
          type: string
          enum: [pending, paid, failed, expired, refunded]
          description: "expired = no longer payable (the reservation window lapsed or the order was cancelled before payment); stock was released."
        fulfilmentStatus: { $ref: "#/components/schemas/FulfilmentStatus" }
        tracking: { $ref: "#/components/schemas/Tracking" }
        createdAt: { type: string, format: date-time }
        email: { type: string }
        shippingAddress: { $ref: "#/components/schemas/Address" }
        gstin: { type: string }
        notes: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        addons:
          type: array
          items: { $ref: "#/components/schemas/Addon" }
        totals: { $ref: "#/components/schemas/Totals" }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }

    PaymentSession:
      type: object
      required: [provider, providerOrderId, amountPaise, currency]
      properties:
        provider: { type: string, enum: [mock, razorpay] }
        providerOrderId: { type: string }
        amountPaise: { $ref: "#/components/schemas/Paise" }
        currency: { type: string, enum: [INR] }
        keyId: { type: string, description: Public key for the provider's client SDK (razorpay only). }

    OrderCreated:
      type: object
      required: [order, payment]
      properties:
        order: { $ref: "#/components/schemas/Order" }
        payment: { $ref: "#/components/schemas/PaymentSession" }
