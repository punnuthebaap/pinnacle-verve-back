openapi: 3.0.3
info:
  title: Pinnacle Verve API
  version: 0.1.0
  description: |
    Storefront API. All money values are integer paise (INR × 100) and GST-inclusive.
    State-changing requests require `Content-Type: application/json` and a same-site Origin.
    Cart and guest orders belong to the anonymous session cookie `pv_sid`.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: catalog
  - name: cart
  - name: checkout
  - name: orders
  - name: payments
  - name: content
  - name: marketing
  - name: admin
    description: Staff-only. Requires the pv_admin session cookie (path /api/v1/admin, SameSite=Strict) except for sign-in.

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        "200":
          description: Service and database are reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/Problem" }

  /categories:
    get:
      tags: [catalog]
      operationId: listCategories
      responses:
        "200":
          description: Active categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }

  /categories/{slug}:
    get:
      tags: [catalog]
      operationId: getCategory
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Category with its filter definitions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryDetail" }
        "404": { $ref: "#/components/responses/Problem" }

  /products:
    get:
      tags: [catalog]
      operationId: listProducts
      parameters:
        - name: category
          in: query
          schema: { type: string, pattern: "^[a-z0-9-]{1,64}$" }
        - name: filter
          in: query
          description: Repeatable facet filter `key:value`, e.g. `material:solid-teak`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 20
            items: { type: string, pattern: "^[a-z0-9-]{1,40}:[a-z0-9-]{1,60}$" }
        - name: minPrice
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: inStock
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, price_asc, price_desc, rating, newest]
            default: featured
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 12 }
      responses:
        "200":
          description: Paged product list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "400": { $ref: "#/components/responses/Problem" }

  /products/{slug}:
    get:
      tags: [catalog]
      operationId: getProduct
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Product with options and variants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404": { $ref: "#/components/responses/Problem" }

  /products/{slug}/reviews:
    get:
      tags: [catalog]
      operationId: listProductReviews
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        "200":
          description: Rating summary (all published ratings) and written reviews, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "404": { $ref: "#/components/responses/Problem" }

  /products/{slug}/related:
    get:
      tags: [catalog]
      operationId: listRelatedProducts
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Curated "pairs well with" products
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductSummary" }
        "404": { $ref: "#/components/responses/Problem" }

  /cart:
    get:
      tags: [cart]
      operationId: getCart
      responses:
        "200": { $ref: "#/components/responses/Cart" }

  /cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItemRequest" }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /cart/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [cart]
      operationId: updateCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCartItemRequest" }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cart]
      operationId: removeCartItem
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "404": { $ref: "#/components/responses/Problem" }

  /cart/addons:
    put:
      tags: [cart]
      operationId: setCartAddons
      description: Replace the set of selected service add-ons (e.g. white-glove wall mount).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCartAddonsRequest" }
      responses:
        "200": { $ref: "#/components/responses/Cart" }
        "422": { $ref: "#/components/responses/Problem" }

  /contact:
    get:
      tags: [content]
      operationId: getContact
      description: Public contact details set by owners in the admin (storefront caches this with tag "settings").
      responses:
        "200":
          description: Contact details
          content:
            application/json:
              schema:
                type: object
                properties:
                  whatsappNumber: { type: string, description: "E.164, e.g. +918084047949; absent when not set." }

  /content/site:
    get:
      tags: [content]
      operationId: getSiteContent
      description: Announcement bar, navigation and footer as saved by editors; 404 until first saved (the storefront then uses its bundled copy).
      responses:
        "200":
          description: Site content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteContent" }
        "404": { $ref: "#/components/responses/Problem" }

  /content/home:
    get:
      tags: [content]
      operationId: getHomeContent
      description: Homepage text as saved by editors; 404 until first saved.
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeContent" }
        "404": { $ref: "#/components/responses/Problem" }

  /content/pages/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
    get:
      tags: [content]
      operationId: getContentPage
      description: A published content page; drafts are not found.
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentPage" }
        "404": { $ref: "#/components/responses/Problem" }


  /checkout-options:
    get:
      tags: [checkout]
      operationId: getCheckoutOptions
      description: Values the storefront needs to render checkout; set by owners in the admin.
      responses:
        "200":
          description: Checkout options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOptions" }

  /cart/notes:
    put:
      tags: [cart]
      operationId: setCartNotes
      description: Bespoke wall & installation instructions; carried into the order at checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              additionalProperties: false
              properties:
                notes: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Cart" }

  /addons:
    get:
      tags: [cart]
      operationId: listAddons
      responses:
        "200":
          description: Purchasable service add-ons
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Addon" }

  /orders:
    post:
      tags: [orders]
      operationId: createOrder
      description: Converts the session cart into an order and opens a payment session. Retrying with the same Idempotency-Key returns the original order.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Order created; client must complete payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderCreated" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /orders/{ref}:
    get:
      tags: [orders]
      operationId: getOrder
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string, pattern: "^PV-[A-Z0-9]{6,12}$" }
      responses:
        "200":
          description: Order owned by the current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Problem" }

  /payments/mock/{providerOrderId}/complete:
    post:
      tags: [payments]
      operationId: completeMockPayment
      description: Development only (PAYMENT_PROVIDER=mock). Simulates the gateway by sending a signed webhook through the real webhook path.
      parameters:
        - name: providerOrderId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [success, failure] }
      responses:
        "204": { description: Webhook processed }
        "404": { $ref: "#/components/responses/Problem" }

  /payments/webhooks/{provider}:
    post:
      tags: [payments]
      operationId: receivePaymentWebhook
      description: Gateway callback. Body is verified against the provider signature header before parsing.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [mock, razorpay] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Accepted (also returned for duplicate events) }
        "401": { $ref: "#/components/responses/Problem" }

  /newsletter/subscriptions:
    post:
      tags: [marketing]
      operationId: subscribeNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { $ref: "#/components/schemas/Email" }
      responses:
        "202": { description: Subscribed (idempotent) }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/session:
    post:
      tags: [admin]
      operationId: adminLogin
      description: Signs in an admin. Accounts lock for 15 minutes after 5 consecutive failures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Signed in; sets the pv_admin cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [admin]
      operationId: adminLogout
      security: [{ adminSession: [] }]
      responses:
        "204": { description: Signed out }

  /admin/me:
    get:
      tags: [admin]
      operationId: adminMe
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: The signed-in admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Problem" }

  /admin/me/password:
    put:
      tags: [admin]
      operationId: adminChangePassword
      description: Changes the signed-in admin's password and signs out their other sessions.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      description: Owner only.
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: All admin accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      operationId: adminCreateUser
      description: Owner only.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/users/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateUser
      description: Owner only. Disabling an account or resetting its password signs it out everywhere. The last active owner cannot be demoted or disabled.
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/audit:
    get:
      tags: [admin]
      operationId: adminListAudit
      description: Owner only. Newest first, 50 per page.
      security: [{ adminSession: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        "200":
          description: Audit log page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/categories:
    get:
      tags: [admin]
      operationId: adminListCategories
      description: Catalogue role. All categories, including inactive ones, with filter definitions.
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminCategory" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      operationId: adminCreateCategory
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCategoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/categories/{id}:
    put:
      tags: [admin]
      operationId: adminUpdateCategory
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCategoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/categories/{id}/facets:
    put:
      tags: [admin]
      operationId: adminSetCategoryFacets
      description: Replaces the filters shown on this category's listing page (order = array order).
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facets]
              additionalProperties: false
              properties:
                facets:
                  type: array
                  maxItems: 12
                  items: { $ref: "#/components/schemas/FacetDefinition" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/products:
    get:
      tags: [admin]
      operationId: adminListProducts
      description: Catalogue role. Search by name, slug or SKU; includes inactive products. 25 per page.
      security: [{ adminSession: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: active
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductPage" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      operationId: adminCreateProduct
      description: Creates the product (inactive until it has an active variant and is switched on).
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductInput" }
      responses:
        "201": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}:
    get:
      tags: [admin]
      operationId: adminGetProduct
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: adminUpdateProduct
      description: Replaces the product's details and content (variants, filters and pairings have their own endpoints).
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProductInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}/variants:
    put:
      tags: [admin]
      operationId: adminSetVariants
      description: Upserts variants (omit id to create). Variants left out are deactivated, never deleted, because orders reference them.
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variants]
              additionalProperties: false
              properties:
                variants:
                  type: array
                  maxItems: 200
                  items: { $ref: "#/components/schemas/AdminVariantInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}/attributes:
    put:
      tags: [admin]
      operationId: adminSetAttributes
      description: Replaces the product's filter values (e.g. shape organic-freeform, material hand-forged-brass).
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attributes]
              additionalProperties: false
              properties:
                attributes:
                  type: array
                  maxItems: 60
                  items: { $ref: "#/components/schemas/AdminAttribute" }
      responses:
        "200": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}/related:
    put:
      tags: [admin]
      operationId: adminSetRelated
      description: Replaces the "pairs well with" list (order = array order).
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productIds]
              additionalProperties: false
              properties:
                productIds:
                  type: array
                  maxItems: 12
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }


  /admin/products/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      operationId: adminUploadImage
      description: Upload one image as the raw request body (JPEG, PNG or WebP, max 10 MB; type is detected from the bytes). Appended after existing images; at most 12 per product.
      security: [{ adminSession: [] }]
      parameters:
        - name: alt
          in: query
          required: true
          description: Alt text describing the image for screen readers and SEO.
          schema: { type: string, minLength: 2, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: adminSetImages
      description: Reorder images and edit alt text. Must list every image of the product exactly once; the first image is the listing image.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              additionalProperties: false
              properties:
                images:
                  type: array
                  maxItems: 12
                  items:
                    type: object
                    required: [id, alt]
                    additionalProperties: false
                    properties:
                      id: { type: string, format: uuid }
                      alt: { type: string, minLength: 2, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}/images/{imageId}:
    delete:
      tags: [admin]
      operationId: adminDeleteImage
      security: [{ adminSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: imageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/AdminProduct" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }


  /admin/orders:
    get:
      tags: [admin]
      operationId: adminListOrders
      description: Orders role. Newest first, 25 per page. q matches ref, email, phone or customer name.
      security: [{ adminSession: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: queue
          in: query
          description: "to_fulfil = paid and not yet dispatched; attention = money to refund or a payment to resolve."
          schema: { type: string, enum: [to_fulfil, attention] }
        - name: status
          in: query
          schema: { type: string, enum: [pending_payment, placed, cancelled] }
        - name: paymentStatus
          in: query
          schema: { type: string, enum: [pending, paid, failed, expired, refunded] }
        - name: fulfilmentStatus
          in: query
          schema: { $ref: "#/components/schemas/FulfilmentStatus" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderPage" }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/orders/{ref}:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string, pattern: "^PV-[A-Z0-9]{6,12}$" }
    get:
      tags: [admin]
      operationId: adminGetOrder
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminOrder" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/orders/{ref}/fulfilment:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string, pattern: "^PV-[A-Z0-9]{6,12}$" }
    post:
      tags: [admin]
      operationId: adminSetFulfilment
      description: "Move a paid order forward (steps may be skipped, never reversed). Tracking can be added or corrected once in transit."
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [preparing, in_transit, delivered, installed] }
                carrier: { type: string, maxLength: 80 }
                trackingNumber: { type: string, maxLength: 80 }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/AdminOrder" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/orders/{ref}/cancel:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string, pattern: "^PV-[A-Z0-9]{6,12}$" }
    post:
      tags: [admin]
      operationId: adminCancelOrder
      description: "Cancel an order that hasn't been dispatched; stock is released. A paid order then shows as refund due."
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/AdminOrder" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/orders/{ref}/refund:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string, pattern: "^PV-[A-Z0-9]{6,12}$" }
    post:
      tags: [admin]
      operationId: adminRecordRefund
      description: "Record a full refund issued in the payment gateway's dashboard (gateway refunds arrive with B1)."
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reference]
              additionalProperties: false
              properties:
                reference: { type: string, minLength: 3, maxLength: 120 }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/AdminOrder" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/orders/{ref}/reinstate:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string, pattern: "^PV-[A-Z0-9]{6,12}$" }
    post:
      tags: [admin]
      operationId: adminReinstateOrder
      description: "Accept a payment captured after the order expired: re-reserves stock (all or nothing) and places the order."
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminOrder" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/orders/{ref}/notes:
    parameters:
      - name: ref
        in: path
        required: true
        schema: { type: string, pattern: "^PV-[A-Z0-9]{6,12}$" }
    post:
      tags: [admin]
      operationId: adminAddOrderNote
      description: "Internal note on the order timeline; never shown to the customer."
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string, minLength: 2, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/AdminOrder" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }


  /admin/settings:
    get:
      tags: [admin]
      operationId: adminGetSettings
      description: Owners only. Commercial values in force.
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/StoreSettings" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: adminUpdateSettings
      description: Owners only. Applies to open carts and new orders immediately; audited with before/after values.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSettingsInput" }
      responses:
        "200": { $ref: "#/components/responses/StoreSettings" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/addons:
    get:
      tags: [admin]
      operationId: adminListAddons
      description: Owners only. All service add-ons, including switched-off ones.
      security: [{ adminSession: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminAddons" }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/addons/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 40 }
    put:
      tags: [admin]
      operationId: adminSaveAddon
      description: Owners only. Creates or updates an add-on. Codes are permanent; switch an add-on off instead of deleting it.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAddonInput" }
      responses:
        "200": { $ref: "#/components/responses/AdminAddons" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }


  /admin/reviews:
    get:
      tags: [admin]
      operationId: adminListReviews
      description: Content role. Newest first, 25 per page. q matches review text, author or product name.
      security: [{ adminSession: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ReviewStatus" }
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: rating
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: writtenOnly
          in: query
          description: Hide rating-only entries (default true).
          schema: { type: boolean, default: true }
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReviewPage" }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      operationId: adminSetReviewStatus
      description: Publish, reject or return a review to pending. The product's rating is recomputed and the storefront revalidated. Review text is never edited.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { $ref: "#/components/schemas/ReviewStatus" }
      responses:
        "204": { description: Updated }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/newsletter:
    get:
      tags: [admin]
      operationId: adminListSubscribers
      description: Content role. Newest first, 25 per page.
      security: [{ adminSession: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        "200":
          description: Subscribers
          content:
            application/json:
              schema:
                type: object
                required: [items, page, total]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [email, createdAt]
                      properties:
                        email: { type: string }
                        createdAt: { type: string, format: date-time }
                  page: { type: integer }
                  total: { type: integer }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/newsletter/export:
    get:
      tags: [admin]
      operationId: adminExportSubscribers
      description: All subscribers as CSV (email, subscribed_at in IST). Audited, as the file contains personal data.
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/newsletter/{email}:
    parameters:
      - name: email
        in: path
        required: true
        schema: { type: string, maxLength: 254 }
    delete:
      tags: [admin]
      operationId: adminRemoveSubscriber
      description: Remove an address, e.g. when the person asks to be forgotten.
      security: [{ adminSession: [] }]
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }


  /admin/content/site:
    get:
      tags: [admin]
      operationId: adminGetSiteContent
      description: Content role. 404 until first saved; the editor then starts from the storefront's bundled copy.
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Site content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSiteContent" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: adminSaveSiteContent
      description: Content role. Links may only be site paths, https, mailto or tel. Revalidates the storefront.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteContent" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSiteContent" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/content/home:
    get:
      tags: [admin]
      operationId: adminGetHomeContent
      description: Content role. 404 until first saved; the editor then starts from the storefront's bundled copy.
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHomeContent" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: adminSaveHomeContent
      description: Content role. Links may only be site paths, https, mailto or tel. Revalidates the storefront.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HomeContent" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHomeContent" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/content/pages:
    get:
      tags: [admin]
      operationId: adminListContentPages
      description: Content role. Saved pages (drafts and published).
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Pages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [slug, title, published, updatedAt]
                      properties:
                        slug: { type: string }
                        title: { type: string }
                        published: { type: boolean }
                        updatedAt: { type: string, format: date-time }
                        updatedBy: { type: string }
        "403": { $ref: "#/components/responses/Problem" }

  /admin/content/pages/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
    get:
      tags: [admin]
      operationId: adminGetContentPage
      security: [{ adminSession: [] }]
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [admin]
      operationId: adminSaveContentPage
      description: Content role. Body is plain text; blank lines separate paragraphs, "## " starts a heading and "- " a bullet.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentPageInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentPage" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }


components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: pv_admin
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{1,80}$" }

  responses:
    StoreSettings:
      description: Store settings
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StoreSettings" }
    AdminAddons:
      description: All add-ons
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: "#/components/schemas/AdminAddon" }
    AdminOrder:
      description: The order with payment details, attention flag and timeline
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminOrder" }
    AdminProduct:
      description: The product with variants, filter values, pairings and images
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminProduct" }
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Cart:
      description: Current session cart
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Cart" }

  schemas:
    UrlSlug:
      type: string
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      minLength: 2
      maxLength: 80

    FacetDefinition:
      type: object
      required: [key, label, kind]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
        label: { type: string, minLength: 1, maxLength: 60 }
        kind: { type: string, enum: [multi, single, swatch] }

    AdminCategoryInput:
      type: object
      required: [slug, name, eyebrow, description, position, isActive]
      additionalProperties: false
      properties:
        slug: { $ref: "#/components/schemas/UrlSlug" }
        name: { type: string, minLength: 2, maxLength: 120 }
        eyebrow: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        position: { type: integer, minimum: 0, maximum: 10000 }
        isActive: { type: boolean }

    AdminCategory:
      allOf:
        - $ref: "#/components/schemas/AdminCategoryInput"
        - type: object
          required: [id, productCount, facets]
          properties:
            id: { type: string, format: uuid }
            productCount: { type: integer }
            facets:
              type: array
              items: { $ref: "#/components/schemas/FacetDefinition" }

    AdminProductSummary:
      type: object
      required: [id, slug, name, isActive, categoryId, categoryName, variantCount, totalStock, minPricePaise, imageUrl]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        isActive: { type: boolean }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        variantCount: { type: integer }
        totalStock: { type: integer }
        minPricePaise: { $ref: "#/components/schemas/Paise" }
        imageUrl: { type: string }

    AdminProductPage:
      type: object
      required: [items, page, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminProductSummary" }
        page: { type: integer }
        total: { type: integer }

    AdminProductInput:
      type: object
      required: [slug, categoryId, name, subtitle, series, materialLabel, sizeLabel, description, shippingNote, badges, features, options, specs, care, facts, gstRateBps, rank, isActive]
      additionalProperties: false
      properties:
        slug: { $ref: "#/components/schemas/UrlSlug" }
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 160 }
        subtitle: { type: string, maxLength: 200 }
        series: { type: string, maxLength: 120 }
        materialLabel: { type: string, maxLength: 120 }
        sizeLabel: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 4000 }
        shippingNote: { type: string, maxLength: 200 }
        badges:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/Badge" }
        features:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/ProductFeature" }
        options:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/ProductOption" }
        specs:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/SpecSection" }
        care:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/CareNote" }
        facts:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/ProductFact" }
        gstRateBps: { type: integer, minimum: 0, maximum: 2800, description: "GST rate in basis points (1800 = 18%)." }
        rank: { type: integer, minimum: 0, maximum: 100000, description: Featured sort order (lower first). }
        isActive: { type: boolean }

    AdminVariant:
      type: object
      required: [id, sku, options, pricePaise, mrpPaise, stock, position, isActive]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        options:
          type: object
          additionalProperties: { type: string }
        pricePaise: { $ref: "#/components/schemas/Paise" }
        mrpPaise: { $ref: "#/components/schemas/Paise" }
        stock: { type: integer }
        position: { type: integer }
        isActive: { type: boolean }

    AdminVariantInput:
      type: object
      required: [sku, options, pricePaise, mrpPaise, stock, isActive]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Omit to create a new variant. }
        sku: { type: string, pattern: "^[A-Z0-9][A-Z0-9-]{1,63}$" }
        options:
          type: object
          maxProperties: 4
          additionalProperties: { type: string, maxLength: 60 }
        pricePaise: { type: integer, format: int64, minimum: 100 }
        mrpPaise: { type: integer, format: int64, minimum: 100 }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        isActive: { type: boolean }

    AdminAttribute:
      type: object
      required: [key, value, label]
      additionalProperties: false
      properties:
        key: { type: string, pattern: "^[a-z0-9-]{1,40}$" }
        value: { type: string, pattern: "^[a-z0-9-]{1,60}$" }
        label: { type: string, minLength: 1, maxLength: 80 }
        swatchHex: { type: string, pattern: "^(#[0-9A-Fa-f]{6})?$" }

    FulfilmentStatus:
      type: string
      enum: [unfulfilled, preparing, in_transit, delivered, installed]

    Tracking:
      type: object
      required: [carrier, number]
      properties:
        carrier: { type: string }
        number: { type: string }

    OrderAttention:
      type: string
      enum: [refund_due, late_capture, amount_mismatch]
